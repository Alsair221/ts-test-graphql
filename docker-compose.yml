services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: vcard
      POSTGRES_PASSWORD: vcard
      POSTGRES_DB: vcard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vcard -d vcard"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://vcard:vcard@db:5432/vcard
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata: